<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TraceLab</title><link rel="stylesheet" href="styles.css"></head>
<body>
<header><div class="brand">◈ <b>TraceLab</b><small> Static Malware Analysis Workbench</small></div><span>● SANDBOX / NO EXECUTION</span></header>
<main>
<section id="drop" class="drop"><div class="orb">⇧</div><h1>Analyze an archive</h1><p>Upload a ZIP/RAR for static inspection. Samples are never executed.</p>
<input id="file" type="file" accept=".zip,.rar"><button id="go">Analyze</button><p id="msg"></p></section>
<section id="app" hidden>
<aside><div class="side">FILES <b id="count">0</b></div><input id="filter" placeholder="Filter files"><div id="tree"></div></aside>
<article><nav><span id="title">Overview</span><button id="scan">Run static scan</button><button id="report">Export report</button></nav>
<div class="tabs"><button data-t="overview">Overview</button><button data-t="code">Code</button><button data-t="hex">Hex</button><button data-t="strings">Strings</button><button data-t="analysis">Analysis</button></div>
<div id="overview" class="pane"></div><pre id="code" class="pane"></pre><pre id="hex" class="pane"></pre><pre id="strings" class="pane"></pre><div id="analysis" class="pane"></div></article>
</section></main><script src="app.js"></script></body></html>
