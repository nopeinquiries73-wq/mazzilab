<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mazzi Lab</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#08060d;color:#eeeafa;font-family:Arial,sans-serif}
header{height:60px;padding:0 20px;border-bottom:1px solid #292039;background:#0d0915;display:flex;align-items:center;justify-content:space-between}
header b{color:#b78cff;font-size:21px}header span{font:11px monospace;color:#b99bff}
main{height:calc(100vh - 60px);padding:24px}.upload{height:100%;border:1px dashed #59427e;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:radial-gradient(circle,#211332,#09070e 58%)}
.upload h1{font-size:30px;margin:8px}.upload p{color:#9b91aa}.orb{font-size:48px;color:#b78cff;text-shadow:0 0 25px #8b5cf6}
.button{display:inline-block;padding:11px 18px;border-radius:7px;border:1px solid #704db0;background:#24153b;color:#dfcfff;cursor:pointer}
#status{margin-top:15px;color:#8e849c}
#work{display:none;height:100%;grid-template-columns:260px 1fr;border:1px solid #292039;border-radius:12px;overflow:hidden}
aside{background:#0c0912;border-right:1px solid #292039;padding:12px;overflow:auto}aside input{width:100%;padding:9px;background:#120e19;border:1px solid #33274a;color:#fff;border-radius:6px;margin-bottom:10px}
.file{padding:8px;border-radius:5px;cursor:pointer;font:12px monospace;color:#bbb1c9}.file:hover,.file.active{background:#211632;color:#cdaeff}
section{min-width:0}.bar{height:55px;padding:10px 14px;border-bottom:1px solid #292039;display:flex;align-items:center;justify-content:space-between}
.tabs{display:flex;border-bottom:1px solid #292039}.tabs button{background:none;border:0;color:#81758e;padding:12px 16px;cursor:pointer}.tabs button.active{color:#bf96ff;border-bottom:2px solid #9b6cff}
.view{height:calc(100% - 96px);overflow:auto;padding:18px;white-space:pre-wrap;font:12px/1.5 Consolas,monospace;background:#08060c}
.card{display:inline-block;vertical-align:top;background:#100b18;border:1px solid #302344;border-radius:8px;padding:15px;margin:0 8px 8px 0;min-width:180px}.card small{display:block;color:#83758f}.card b{display:block;margin-top:7px;word-break:break-all;color:#e8dcff}
button{font-family:inherit}
@media(max-width:750px){#work{grid-template-columns:210px}.upload{padding:20px}}
</style>
</head>
<body>
<header><b>◈ Mazzi Lab</b><span>STATIC MODE · NO EXECUTION</span></header>
<main>
<div id="upload" class="upload">
<div class="orb">◈</div><h1>Open an archive</h1>
<p>Choose a ZIP file to inspect it safely in your browser.</p>
<label class="button">Choose ZIP<input id="input" type="file" accept=".zip" hidden></label>
<div id="status"></div>
</div>
<div id="work">
<aside><input id="search" placeholder="Search files"><div id="files"></div></aside>
<section>
<div class="bar"><span id="name">Select a file</span><button class="button" id="scan">Static Scan</button></div>
<div class="tabs"><button class="active" data-tab="info">Info</button><button data-tab="code">Code</button><button data-tab="hex">Hex</button><button data-tab="strings">Strings</button></div>
<div id="info" class="view"></div><div id="code" class="view" style="display:none"></div><div id="hex" class="view" style="display:none"></div><div id="strings" class="view" style="display:none"></div>
</section>
</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script>
const $=x=>document.querySelector(x);let files=[],current=null;
function size(n){return n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(1)+' MB'}
function hash(b){return crypto.subtle.digest('SHA-256',b).then(x=>[...new Uint8Array(x)].map(v=>v.toString(16).padStart(2,'0')).join(''))}
function hex(b){let s='';for(let i=0;i<Math.min(b.length,4096);i+=16){let h='',a='';for(let j=0;j<16;j++){if(i+j<b.length){let x=b[i+j];h+=x.toString(16).padStart(2,'0')+' ';a+=x>=32&&x<127?String.fromCharCode(x):'.'}else{h+='   ';a+=' '}}s+=i.toString(16).padStart(8,'0')+'  '+h+' |'+a+'|\\n'}return s}
function strings(b){let a=[],s='';for(let x of b){if(x>=32&&x<127)s+=String.fromCharCode(x);else{if(s.length>=4)a.push(s);s=''}}if(s.length>=4)a.push(s);return [...new Set(a)].join('\\n')}
async function openZip(f){$('#status').textContent='Opening…';try{let z=await JSZip.loadAsync(await f.arrayBuffer());files=[];z.forEach((path,e)=>{if(!e.dir)files.push({path,e})});$('#upload').style.display='none';$('#work').style.display='grid';draw();$('#info').innerHTML='<div class=card><small>Archive</small><b>'+f.name+'</b></div><div class=card><small>Files</small><b>'+files.length+'</b></div><div class=card><small>Mode</small><b>Static only</b></div>'}catch(e){$('#status').textContent='Could not open this ZIP. Try another ZIP file.'}}
function draw(){let q=$('#search').value.toLowerCase();$('#files').innerHTML='';files.filter(x=>x.path.toLowerCase().includes(q)).forEach((x,i)=>{let d=document.createElement('div');d.className='file';d.textContent='📄 '+x.path;d.onclick=()=>select(i);$('#files').appendChild(d)})}
async function select(i){current=files[i];let b=await current.e.async('uint8array');$('#name').textContent=current.path;document.querySelectorAll('.file').forEach(x=>x.classList.remove('active'));[...document.querySelectorAll('.file')].find(x=>x.textContent.includes(current.path))?.classList.add('active');let text=new TextDecoder().decode(b),h=await hash(b);$('#info').innerHTML='<div class=card><small>File</small><b>'+current.path+'</b></div><div class=card><small>Size</small><b>'+size(b.length)+'</b></div><div class=card><small>SHA-256</small><b>'+h+'</b></div>';$('#code').textContent=text;$('#hex').textContent=hex(b);$('#strings').textContent=strings(b)||'No printable strings found.'}
$('#input').onchange=e=>e.target.files[0]&&openZip(e.target.files[0]);$('#search').oninput=draw;
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');['info','code','hex','strings'].forEach(x=>$('#'+x).style.display=x===b.dataset.tab?'block':'none')});
$('#scan').onclick=()=>alert(current?'Static inspection only. Mazzi Lab never executes uploaded files.':'Choose a file first.');
</script>
</body>
</html>
